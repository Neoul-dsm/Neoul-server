# Isolated sample data for client development only
spring:
  datasource:
    url: jdbc:h2:mem:neoul-client-preview;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

server:
  address: 127.0.0.1

jwt:
  secret: preview-only-secret-not-for-production-use-123456789

monitoring:
  ship-connection-timeout: PT2M
