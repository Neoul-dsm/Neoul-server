spring:
  config:
    import: optional:file:./.env[.properties]
  application:
    name: ex
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: true

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000
