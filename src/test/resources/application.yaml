spring:
  datasource:
    url: jdbc:h2:mem:neoul;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop

jwt:
  secret: ${JWT_SECRET:test-secret-must-be-at-least-thirty-two-bytes}
  access-token-expiration: 3600000
